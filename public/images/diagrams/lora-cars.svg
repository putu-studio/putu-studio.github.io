<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Two cars on a mountain road chatting over LoRa with no cell signal</title>
  <rect width="960" height="420" fill="#ffffff"/>
  <!-- mountains -->
  <path d="M0 300 L120 170 L200 240 L320 110 L430 230 L520 150 L640 260 L760 130 L860 220 L960 160 L960 330 L0 330 Z" fill="#f1ede5"/>
  <path d="M320 110 L350 140 L335 138 L320 150 L305 135 Z M760 130 L788 158 L772 155 L760 166 L746 152 Z" fill="#ffffff" opacity="0.9"/>
  <text x="480" y="252" text-anchor="middle" font-size="15" fill="#6d675e">no cell signal</text>
  <!-- road -->
  <rect x="0" y="330" width="960" height="90" fill="#d9d3c7"/>
  <path d="M0 375 H960" stroke="#ffffff" stroke-width="4" stroke-dasharray="34 26"/>

  <!-- car A -->
  <g transform="translate(70,262)">
    <path d="M10 70 L10 45 Q12 34 26 32 L70 28 L100 6 Q108 0 120 0 L190 0 Q204 0 214 10 L240 32 L272 36 Q290 40 290 56 L290 70 Z" fill="#2f6f62"/>
    <path d="M108 10 L128 10 L128 30 L82 32 Z M136 10 L188 10 Q196 10 202 16 L218 30 L136 30 Z" fill="#cfe3dc"/>
    <circle cx="70" cy="72" r="20" fill="#22201c"/><circle cx="70" cy="72" r="8" fill="#a39d92"/>
    <circle cx="230" cy="72" r="20" fill="#22201c"/><circle cx="230" cy="72" r="8" fill="#a39d92"/>
    <!-- box + antenna on dashboard -->
    <rect x="150" y="18" width="26" height="14" rx="3" fill="#f5a524"/>
    <line x1="170" y1="18" x2="170" y2="-30" stroke="#22201c" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- car B -->
  <g transform="translate(890,262) scale(-1,1)">
    <path d="M10 70 L10 45 Q12 34 26 32 L70 28 L100 6 Q108 0 120 0 L190 0 Q204 0 214 10 L240 32 L272 36 Q290 40 290 56 L290 70 Z" fill="#5b6f8f"/>
    <path d="M108 10 L128 10 L128 30 L82 32 Z M136 10 L188 10 Q196 10 202 16 L218 30 L136 30 Z" fill="#dbe3f0"/>
    <circle cx="70" cy="72" r="20" fill="#22201c"/><circle cx="70" cy="72" r="8" fill="#a39d92"/>
    <circle cx="230" cy="72" r="20" fill="#22201c"/><circle cx="230" cy="72" r="8" fill="#a39d92"/>
    <rect x="150" y="18" width="26" height="14" rx="3" fill="#f5a524"/>
    <line x1="170" y1="18" x2="170" y2="-30" stroke="#22201c" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- LoRa link between antennas (car A antenna ~ x240,y232; car B ~ x720,y232) -->
  <path d="M244 226 C 360 60, 600 60, 716 226" fill="none" stroke="#f5a524" stroke-width="3.5" stroke-dasharray="12 9"/>
  <g fill="none" stroke="#f5a524" stroke-width="3" stroke-linecap="round">
    <path d="M256 214 q10 -12 0 -24"/><path d="M266 222 q18 -20 0 -40" opacity="0.6"/>
    <path d="M704 214 q-10 -12 0 -24"/><path d="M694 222 q-18 -20 0 -40" opacity="0.6"/>
  </g>
  <rect x="392" y="62" width="176" height="50" rx="10" fill="#ffffff" stroke="#e8e3d9" stroke-width="2"/>
  <text x="480" y="84" text-anchor="middle" font-size="17" font-weight="700" fill="#b86e00">LoRa · 915 MHz</text>
  <text x="480" y="103" text-anchor="middle" font-size="13" fill="#6d675e">about 1–4 km on the highway</text>

  <!-- phones + wifi, car A -->
  <g transform="translate(60,150)">
    <rect x="0" y="0" width="30" height="52" rx="6" fill="#ffffff" stroke="#22201c" stroke-width="2.5"/>
    <rect x="42" y="14" width="30" height="52" rx="6" fill="#ffffff" stroke="#22201c" stroke-width="2.5"/>
    <g stroke="#2f6f62" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M92 74 q14 -12 28 0"/><path d="M86 66 q20 -20 40 0"/></g>
    <text x="0" y="-12" font-size="14" fill="#2f6f62" font-weight="600">phones join the box's Wi-Fi</text>
  </g>
  <!-- phones + wifi, car B -->
  <g transform="translate(828,150)">
    <rect x="42" y="0" width="30" height="52" rx="6" fill="#ffffff" stroke="#22201c" stroke-width="2.5"/>
    <rect x="0" y="14" width="30" height="52" rx="6" fill="#ffffff" stroke="#22201c" stroke-width="2.5"/>
    <g stroke="#2f6f62" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M-48 74 q14 -12 28 0"/><path d="M-54 66 q20 -20 40 0"/></g>
  </g>
  <text x="140" y="404" font-size="14" fill="#22201c" font-weight="600">Car A · one box</text>
  <text x="820" y="404" text-anchor="end" font-size="14" fill="#22201c" font-weight="600">Car B · one box</text>
</svg>
