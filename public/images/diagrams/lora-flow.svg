<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How a message travels from a phone in car A to phones in car B</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6d675e"/></marker></defs>
  <rect width="680" height="560" fill="#ffffff"/>
  <text x="150" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#22201c">Car A</text>
  <text x="530" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#22201c">Car B</text>
  <g font-size="17">
    <!-- A column -->
    <rect x="50" y="60" width="200" height="66" rx="10" fill="#f1ede5"/>
    <text x="150" y="90" text-anchor="middle" font-weight="650" fill="#22201c">Phone browser</text>
    <text x="150" y="112" text-anchor="middle" font-size="14" fill="#6d675e">types a message</text>
    <rect x="50" y="190" width="200" height="86" rx="10" fill="#e6f0ec" stroke="#2f6f62" stroke-width="2"/>
    <text x="150" y="222" text-anchor="middle" font-weight="650" fill="#22201c">ESP32-S3</text>
    <text x="150" y="244" text-anchor="middle" font-size="14" fill="#6d675e">serves the chat page</text>
    <text x="150" y="264" text-anchor="middle" font-size="14" fill="#6d675e">encrypts (AES-GCM)</text>
    <rect x="50" y="340" width="200" height="66" rx="10" fill="#fdf1dc" stroke="#b86e00" stroke-width="2"/>
    <text x="150" y="370" text-anchor="middle" font-weight="650" fill="#22201c">SX1262 radio</text>
    <text x="150" y="392" text-anchor="middle" font-size="14" fill="#6d675e">transmits at 915 MHz</text>
    <!-- B column -->
    <rect x="430" y="340" width="200" height="66" rx="10" fill="#fdf1dc" stroke="#b86e00" stroke-width="2"/>
    <text x="530" y="370" text-anchor="middle" font-weight="650" fill="#22201c">SX1262 radio</text>
    <text x="530" y="392" text-anchor="middle" font-size="14" fill="#6d675e">receives the packet</text>
    <rect x="430" y="190" width="200" height="86" rx="10" fill="#e6f0ec" stroke="#2f6f62" stroke-width="2"/>
    <text x="530" y="222" text-anchor="middle" font-weight="650" fill="#22201c">ESP32-S3</text>
    <text x="530" y="244" text-anchor="middle" font-size="14" fill="#6d675e">decrypts, checks counter</text>
    <text x="530" y="264" text-anchor="middle" font-size="14" fill="#6d675e">pushes to the chat page</text>
    <rect x="430" y="60" width="200" height="66" rx="10" fill="#f1ede5"/>
    <text x="530" y="90" text-anchor="middle" font-weight="650" fill="#22201c">Every phone</text>
    <text x="530" y="112" text-anchor="middle" font-size="14" fill="#6d675e">sees the message</text>
  </g>
  <g stroke="#6d675e" stroke-width="2.5" marker-end="url(#a)">
    <line x1="150" y1="128" x2="150" y2="186"/><line x1="150" y1="278" x2="150" y2="336"/>
    <line x1="530" y1="338" x2="530" y2="280"/><line x1="530" y1="188" x2="530" y2="130"/>
  </g>
  <g font-size="13" fill="#6d675e" font-family="ui-monospace, Consolas, monospace">
    <text x="162" y="162">Wi-Fi</text><text x="162" y="312">SPI</text>
    <text x="542" y="312">SPI</text><text x="542" y="162">Wi-Fi</text>
  </g>
  <path d="M252 373 C 320 470, 360 470, 428 373" fill="none" stroke="#b86e00" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#a)"/>
  <text x="340" y="490" text-anchor="middle" font-size="15" font-weight="700" fill="#b86e00">LoRa radio link</text>
  <text x="340" y="512" text-anchor="middle" font-size="13" fill="#6d675e">SF9 · 125 kHz · CR 4/5</text>
</svg>
