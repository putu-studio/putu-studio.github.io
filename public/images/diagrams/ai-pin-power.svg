<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AI pin power path: USB-C to TP4056 charger to LiPo, then through a switch to the XIAO, with a battery sense divider</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6d675e"/></marker></defs>
  <rect width="680" height="330" fill="#ffffff"/>
  <g font-size="16">
    <rect x="20" y="40" width="150" height="72" rx="10" fill="#f1ede5"/>
    <text x="95" y="70" text-anchor="middle" font-weight="650" fill="#22201c">USB-C</text>
    <text x="95" y="92" text-anchor="middle" font-size="13" fill="#6d675e">5.1 kΩ CC · TVS</text>
    <rect x="260" y="40" width="160" height="72" rx="10" fill="#fdf1dc" stroke="#b86e00" stroke-width="2"/>
    <text x="340" y="70" text-anchor="middle" font-weight="650" fill="#22201c">TP4056</text>
    <text x="340" y="92" text-anchor="middle" font-size="12" fill="#6d675e">2.4 kΩ PROG · ~500 mA</text>
    <rect x="260" y="210" width="160" height="72" rx="10" fill="#f1ede5"/>
    <text x="340" y="240" text-anchor="middle" font-weight="650" fill="#22201c">LiPo cell</text>
    <text x="340" y="262" text-anchor="middle" font-size="13" fill="#6d675e">1100 mAh</text>
    <rect x="500" y="40" width="160" height="72" rx="10" fill="#e6f0ec" stroke="#2f6f62" stroke-width="2"/>
    <text x="580" y="70" text-anchor="middle" font-weight="650" fill="#22201c">XIAO ESP32-S3</text>
    <text x="580" y="92" text-anchor="middle" font-size="13" fill="#6d675e">Sense (mic)</text>
    <rect x="500" y="210" width="160" height="72" rx="10" fill="#f1ede5"/>
    <text x="580" y="240" text-anchor="middle" font-weight="650" fill="#22201c">Divider → ADC</text>
    <text x="580" y="262" text-anchor="middle" font-size="13" fill="#6d675e">battery level</text>
  </g>
  <g stroke="#6d675e" stroke-width="2.5" fill="none" marker-end="url(#a)">
    <line x1="172" y1="76" x2="256" y2="76"/>
    <path d="M320 114 L320 206"/>
    <path d="M360 206 L360 114"/>
    <line x1="422" y1="76" x2="496" y2="76"/>
    <path d="M422 246 L496 246"/>
    <path d="M580 208 L580 116"/>
  </g>
  <g font-size="12" fill="#6d675e" font-family="ui-monospace, Consolas, monospace">
    <text x="190" y="66">VBUS</text><text x="272" y="166">charge</text><text x="368" y="166">BAT</text>
    <text x="432" y="66">OUT · switch</text><text x="430" y="236">sense</text><text x="588" y="166">GPIO</text>
  </g>
</svg>
